 # One-shot Job that creates the database schema before the backend serves requests.
# Runs once per deploy so API replicas never race to create tables.
# Jobs are immutable: kind-up.sh deletes the old one before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: taskapp
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: task-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.db.init_db"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
