# Local full-stack environment: PostgreSQL, schema init, API, React site, proxy, and optional HTTPS.
name: taskmanager

# Shared by db-init and backend so both run the same image and settings.
x-backend: &backend
  build: ./backend
  image: task-backend:local
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD:-dev_only_password}@postgres:5432/${POSTGRES_DB:-taskapp}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    APP_ENV: ${APP_ENV:-development}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-taskapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema creation, so API replicas never race to create tables.
  db-init:
    <<: *backend
    command: ["python", "-m", "app.db.init_db"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Static SPA only (nginx). Routing to /api is the proxy's job.
  web:
    build: ./frontend
    image: task-frontend:local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Edge proxy: the compose stand-in for the Kubernetes Ingress. Open http://localhost:8080
  proxy:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/routes.conf:/etc/nginx/routes.conf:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # --- Optional HTTPS: `docker compose --profile https up` then open https://localhost:8443 ---
  certs:
    image: alpine/openssl
    profiles: ["https"]
    entrypoint: ["sh", "-c"]
    command:
      - >
        [ -f /certs/tls.crt ] || openssl req -x509 -nodes -newkey rsa:2048 -days 365
        -keyout /certs/tls.key -out /certs/tls.crt -subj /CN=localhost
        -addext subjectAltName=DNS:localhost
    volumes:
      - ./certs:/certs
    restart: "no"

  proxy-https:
    image: nginx:stable-alpine
    profiles: ["https"]
    volumes:
      - ./nginx/proxy.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/routes.conf:/etc/nginx/routes.conf:ro
      - ./certs:/certs:ro
    ports:
      - "8443:443"
    depends_on:
      certs:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
