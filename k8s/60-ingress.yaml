 # Routes incoming HTTP paths to the frontend or backend Service through ingress-nginx.
# Edge routing (the Kubernetes counterpart of nginx/proxy.conf). Served by ingress-nginx,
# reachable from the host at http://localhost:8081 via the Kind port mapping.
# HTTPS: add a `tls:` section with a cert-manager issued Secret; see README "Security and HTTPS".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: taskapp
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
