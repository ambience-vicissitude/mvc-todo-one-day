 # Defines the local Kind cluster topology and host-port mappings for ingress traffic.
# Kind runs each Kubernetes node as a Docker container.
# This one node also hosts the ingress controller,
# so host ports 8081/8444 are mapped to its 80/443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8444
        protocol: TCP
