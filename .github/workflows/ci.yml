name: ci

# Validates backend and frontend code, builds the stack, and runs its integration smoke test.
# Future nice-to-haves (not enabled, see README section 16): Dependabot, Trivy, hadolint, CodeQL,
# helm/kind-action deploy test, GHCR publishing.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Builds both Docker images, starts the full stack, and runs the smoke test against it.
  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: bash scripts/integration-test.sh
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
