# TLS terminates here; the backend and web containers stay plain HTTP on the private network.
# Self-signed for local use (browser warning). In production: a real certificate (Let's Encrypt /
# cert-manager) and an HSTS header. HSTS is omitted here because browsers apply it to every
# localhost port, which would break the plain-HTTP proxy.
server {
  listen 443 ssl;
  ssl_certificate /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/routes.conf;
}
